[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",   # FastAPI's dependency-injection idiom puts Depends()/Query() in argument defaults.
    "E501",   # line length is left to `ruff format`; long argparse help strings are fine.
    "UP042",  # (str, Enum) kept on purpose: switching to StrEnum changes str() output the DB enums rely on.
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # passlib 1.7.4 probes bcrypt.__about__, which newer bcrypt removed; harmless.
    "ignore::DeprecationWarning:passlib.*",
    # Starlette's TestClient nags about httpx; it's FastAPI's documented test client.
    "ignore:Using `httpx` with `starlette.testclient`",
]
